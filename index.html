<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Пример бургер-меню</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="#" class="brand" aria-label="На главную">
        <img src="assets/logo.svg" alt="Логотип бренда" class="brand-logo" />
        <span class="brand-name">Ваш бренд</span>
      </a>

      <button class="burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="site-menu">
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
      </button>
    </header>

    <nav id="site-menu" class="overlay-menu" hidden>
      <ul class="menu-list" role="menu">
        <li role="none"><a role="menuitem" href="#hero" class="menu-link" data-menu-link>Главная</a></li>
        <li role="none"><a role="menuitem" href="#products" class="menu-link" data-menu-link>Продукция</a></li>
        <li role="none"><a role="menuitem" href="#about" class="menu-link" data-menu-link>О нас</a></li>
        <li role="none"><a role="menuitem" href="#contacts" class="menu-link" data-menu-link>Контакты</a></li>
      </ul>
    </nav>

    <main class="page-content">
      <section id="hero" class="demo-section">
        <h1>Демо страница</h1>
        <p>Нажмите на бургер справа, чтобы открыть меню.</p>
      </section>
      <section id="products" class="demo-section">
        <h2>Продукция</h2>
        <p>Контент для демонстрации прокрутки.</p>
      </section>
      <section id="about" class="demo-section">
        <h2>О нас</h2>
        <p>Контент для демонстрации прокрутки.</p>
      </section>
      <section id="contacts" class="demo-section">
        <h2>Контакты</h2>
        <p>Контент для демонстрации прокрутки.</p>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
